<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Remote monitor</title>
    <link rel="stylesheet" href="styles/main.css">
</head>

<body>
    <div class="device-frame">
        <header class="site-header">
            <div class="brand">
                <img src="images/logo.png" alt="Remote monitor logo" class="logo" />
                <div>
                    <h1 class="title">Remote monitor</h1>
                    <p class="subtitle">Inverter Monitoring &amp; Control</p>
                </div>
            </div>
            <nav class="site-nav">
                <a href="config/config.html" class="nav-link">⚙ Configure</a>
            </nav>
        </header>

        <main class="page">
            <!-- STATUS -->
            <section id="status" class="card">
                <h2 class="card-title">Status</h2>
                <div class="status-grid">
                    <div class="indicator network-indicator">
                        <span class="label">Network:</span>
                        <span id="network-status" class="value network-disconnected"
                            aria-live="polite">Disconnected</span>
                    </div>
                    <div class="indicator status-indicator">
                        <span class="label">Inverter:</span>
                        <span id="inverter-status" class="value inverter-off" aria-live="polite">OFFLINE</span>
                    </div>
                    <div class="indicator value-indicator">
                        <span class="label">Voltage</span>
                        <span id="value-field" class="value">--</span>
                    </div>
                    <div class="indicator value-indicator">
                        <span class="label">Current</span>
                        <span id="value-field" class="value">--</span>
                    </div>
                </div>
            </section>

            <!-- CONTROLS -->
            <section id="controls" class="card">
                <h2 class="card-title">Controls</h2>
                <div class="controls-grid">
                    <p id="controls-feedback" class="feedback"></p>
                    <button id="btn-start" class="btn">Start inverter</button>
                    <button id="btn-stop" class="btn btn-ghost">Stop inverter</button>
                </div>
            </section>

            <!-- LOG -->
            <section id="log" class="card">
                <h2 class="card-title">System Log</h2>
                <div id="log-entries" class="log" aria-live="polite">No logs yet...</div>
            </section>
        </main>

        <footer class="site-footer">
            <small>&copy; 2026 to now Device Design Lab</small>
        </footer>
    </div>

    <script src="scripts/main.js"></script>
</body>

</html>
