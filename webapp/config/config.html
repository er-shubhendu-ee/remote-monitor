<!-- config/config.html : Configuration UI -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configure - Remote monitor</title>
    <link rel="stylesheet" href="styles/main.css">
</head>

<body>
    <div class="device-frame">
        <header class="site-header">
            <h1>Configuration</h1>
            <nav>
                <a href="../index.html" class="nav-link">🏠 Home</a>
            </nav>
        </header>

        <main class="page">
            <!-- Network Settings -->
            <section class="card">
                <h2>Network Settings</h2>
                <form id="network-form">
                    <label for="ssid">WiFi SSID:</label>
                    <input type="text" id="ssid" name="ssid" placeholder="Enter SSID">

                    <label for="password">WiFi Password:</label>
                    <input type="password" id="password" name="password" placeholder="Enter Password">

                    <button type="submit" class="btn">Save Network</button>
                    <p id="network-feedback" class="feedback"></p>
                </form>
                <!-- Network status -->
                <div class="status-grid">
                    <div class="indicator network-indicator">
                        <span class="label">Network status:</span>
                        <span id="netwok-status" class="value network-disconnected"
                            aria-live="polite">Disconnected</span>
                    </div>
                </div>
            </section>
        </main>
        <footer class="site-footer">
            <p>&copy; 2026 to now Device Design Lab</p>
        </footer>
    </div>
    <script src="scripts/main.js"></script>
</body>

</html>
